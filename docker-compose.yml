services:
  api:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - PORT=${PORT:-5000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SECRET_KEY=${SECRET_KEY:-}
    volumes:
      - .:/app
    container_name: autonomous-vehicle-api
